# Docker Compose for Oral Narrative Preservation System
# Usage:
#   Full deployment:     docker compose --profile full up -d
#   Standard (API only): docker compose --profile standard up -d
#   Lite (SQLite):       docker compose --profile lite up -d

services:
  db:
    image: postgres:15-alpine
    container_name: oral-narratives-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oral_narratives}
      POSTGRES_USER: ${POSTGRES_USER:-narrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-narrator123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narrator -d oral_narratives"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    profiles:
      - full
      - standard

  redis:
    image: redis:7-alpine
    container_name: oral-narratives-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    profiles:
      - full
      - standard

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-production}
    container_name: oral-narratives-api
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://narrator:narrator123@db:5432/oral_narratives}
      - USE_SQLITE=${USE_SQLITE:-false}
      - SQLITE_PATH=${SQLITE_PATH:-/app/data/oral_narratives.db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - ASYNC_PROCESSING=${ASYNC_PROCESSING:-true}
      - SEED_SAMPLE_DATA=false
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
      - sqlite_data:/app/data
    expose:
      - "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    networks:
      - backend
    profiles:
      - full
      - standard
      - lite

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oral-narratives-worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2}
    environment:
      - DATABASE_URL=postgresql://narrator:narrator123@db:5432/oral_narratives
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SEED_SAMPLE_DATA=false
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    profiles:
      - full

  flower:
    image: mher/flower:2.0
    container_name: oral-narratives-flower
    restart: always
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SEED_SAMPLE_DATA=false
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      - redis
      - worker
    networks:
      - backend
    profiles:
      - full

  frontend:
    image: nginx:alpine
    container_name: oral-narratives-frontend
    restart: always
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - backend
    profiles:
      - full
      - standard

volumes:
  postgres_data:
  redis_data:
  storage_data:
  sqlite_data:

networks:
  backend:
    driver: bridge
